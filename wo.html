<head>

<title>Velvet Elite | Membership Access</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#0b0b0b;
color:#d4af37;
text-align:center;
line-height:1.6;
}

/* HERO */

.hero{
padding:70px 16px;
background:radial-gradient(circle at top,#1a1a1a,#0b0b0b);
}

h1{
font-size:38px;
margin:0;
}

.hero p{
opacity:.85;
max-width:700px;
margin:12px auto 0;
font-size:15px;
}

/* WRAPPER */

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

/* PRICING */

.pricing{
display:flex;
gap:18px;
justify-content:center;
flex-wrap:wrap;
margin-top:30px;
}

/* CARD */

.plan{
background:linear-gradient(145deg,#151515,#0f0f0f);
border:1px solid rgba(212,175,55,.15);
border-radius:16px;
padding:26px;
width:320px;
text-align:left;
position:relative;
box-shadow:0 10px 30px rgba(0,0,0,.4);
transition:.2s;
}

.plan:hover{
transform:translateY(-4px);
border-color:rgba(212,175,55,.4);
}

/* POPULAR */

.popular{
border:1px solid rgba(212,175,55,.6);
background:linear-gradient(145deg,rgba(212,175,55,.08),#0f0f0f);
transform:scale(1.05);
}

/* BADGE */

.badge{
position:absolute;
top:14px;
right:14px;
background:#d4af37;
color:#0b0b0b;
font-size:11px;
padding:5px 10px;
border-radius:20px;
font-weight:700;
}

/* PRICE */

.price{
font-size:28px;
margin:10px 0;
color:#f5dc8a;
}

ul{
padding-left:18px;
font-size:14px;
opacity:.9;
}

.button{
display:block;
text-align:center;
margin-top:18px;
padding:14px;
background:#d4af37;
color:#0b0b0b;
font-weight:700;
border-radius:12px;
text-decoration:none;
}

/* SECTION */

.section{
max-width:900px;
margin:40px auto;
text-align:left;
background:#141414;
padding:22px;
border-radius:14px;
border:1px solid rgba(212,175,55,.15);
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
font-size:13px;
}

th,td{
border-bottom:1px solid rgba(212,175,55,.15);
padding:10px;
text-align:center;
}

th{
color:#f5dc8a;
}

/* NOTICE */

.notice{
background:linear-gradient(145deg,#151515,#0f0f0f);
border-left:3px solid #d4af37;
padding:18px;
border-radius:12px;
margin-top:20px;
font-size:14px;
}

/* FOOTER */

.footer{
opacity:.6;
font-size:12px;
margin:40px 0 20px;
text-align:center;
}

/* LANGUAGE BAR */

.language-bar{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:8px;
margin:20px 0;
}

.language-btn{
padding:7px 12px;
border-radius:20px;
font-size:11px;
background:#141414;
color:#d4af37;
border:1px solid rgba(212,175,55,0.25);
cursor:pointer;
}

.language-btn.active{
background:#d4af37;
color:#0b0b0b;
}

/* DROPDOWN */

.select-wrapper{
position:relative;
}

.select-wrapper select{
appearance:none;
-webkit-appearance:none;
-moz-appearance:none;

padding:7px 34px 7px 14px;

border-radius:20px;
font-size:11px;
font-weight:500;

background:#141414;
color:#d4af37;

border:1px solid rgba(212,175,55,0.25);

cursor:pointer;
outline:none;
}

/* CUSTOM ARROW */

.select-wrapper::after{
content:"▼";
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
font-size:9px;
color:#d4af37;
pointer-events:none;
}

/* MOBILE */

@media(max-width:900px){

.pricing{
flex-direction:column;
align-items:center;
}

.plan{
width:90%;
}

.popular{
transform:none;
}

h1{
font-size:30px;
}

}

</style>
</head>
