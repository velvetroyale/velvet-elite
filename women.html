.benefits{

label{

input{

button[type="submit"]{

button[type="submit"]:hover{

.language-btn{

.select-wrapper select {

}

/* CUSTOM ARROW */

privacy:"🔒 गोपनीय आवेदन। कोई सार्वजनिक प्रोफ़ाइल नहीं। कोई स्वचालित मैचिंग नहीं।",

b2:"✔ निजी अंतरराष्ट्रीय परिचय",
b3:"✔ सत्यापित वैश्विक सदस्य नेटवर्क",
b4:"✔ सीमित प्रवेश (चयनात्मक अनुमोदन)"
}

};


function setLang(l, btn){

// remove active state
document.querySelectorAll('.language-btn')
.forEach(b => b.classList.remove('active'));

if(btn){
    btn.classList.add('active');
}

const t = lang[l];
if(!t) return;

// update main text
document.getElementById("desc").innerText = t.desc;
document.getElementById("btn").innerText = t.btn;
document.getElementById("privacy").innerText = t.privacy;

// safe handling for b1-b4 if they exist
["b1","b2","b3","b4"].forEach(id=>{
    const el = document.getElementById(id);

    if(el && t[id]){
        el.innerText = t[id];
    }
});

// translate labels
document.querySelectorAll("label").forEach(el=>{
    const k = el.getAttribute("data-key");

    if(k && t[k]){
        el.innerText = t[k];
    }
});

document.getElementById("selectedLanguage").value = l;

}

</script>
